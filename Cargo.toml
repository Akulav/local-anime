[workspace]
resolver = "2"
members = ["crates/tsukimi-core", "app"]

[workspace.package]
# THE app version: scripts/bump-version.ps1 changes it (with Cargo.lock and CHANGELOG.md); pushing a new
# version to main publishes a release (.github/workflows/release.yml).
version = "4.2.0"
edition = "2021"
license = "LicenseRef-Akulav-Source-Available-1.0"
authors = ["Akulav", "serifpersia"]
repository = "https://github.com/Akulav/local-anime"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
