[workspace]
resolver = "2"
members = ["crates/dango-core", "app"]

[workspace.package]
version = "4.0.4"
edition = "2021"
license = "MIT"
authors = ["serifpersia"]
repository = "https://github.com/serifpersia/dango"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
