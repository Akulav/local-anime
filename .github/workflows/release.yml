name: Release

# Publishes a release when [workspace.package].version in Cargo.toml changes: edit it, commit,
# push. The workflow tests, builds for Windows and Linux, tags v<version> on that commit and
# publishes the release. It never pushes commits, so local main stays in sync. A version that
# already has its tag is skipped. "Run workflow" on the Actions page does the same for the
# current version (e.g. after a failed run).

on:
  push:
    branches: [main]
    # (this file too: a change to how releases are made publishes the current version if it isn't out yet)
    paths: [Cargo.toml, .github/workflows/release.yml]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: New version?
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        run: |
          v=$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "::notice::v$v is already released: nothing to publish (bump the version in Cargo.toml for a new release)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, test]
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x86_64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and bundle
        working-directory: app
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --bundles $([ "$RUNNER_OS" = Windows ] && echo nsis || echo appimage,deb)

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          b=target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/dango.exe "dist/dango-v$VERSION-windows-x64-portable.exe"
            cp $b/nsis/*.exe "dist/dango-v$VERSION-windows-x64-setup.exe"
          else
            tar -C target/release -czf "dist/dango-v$VERSION-linux-x86_64.tar.gz" dango
            cp $b/appimage/*.AppImage "dist/dango-v$VERSION-linux-x86_64.AppImage"
            cp $b/deb/*.deb "dist/dango-v$VERSION-linux-amd64.deb"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dango-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          {
            echo "## dango v$VERSION"
            echo
            echo "| Platform | Download |"
            echo "| --- | --- |"
            echo "| Windows (installer) | \`dango-v$VERSION-windows-x64-setup.exe\` |"
            echo "| Windows (portable) | \`dango-v$VERSION-windows-x64-portable.exe\` |"
            echo "| Linux AppImage | \`dango-v$VERSION-linux-x86_64.AppImage\` |"
            echo "| Debian/Ubuntu | \`dango-v$VERSION-linux-amd64.deb\` |"
            echo "| Linux binary | \`dango-v$VERSION-linux-x86_64.tar.gz\` |"
            echo
            echo "### Changes"
            if [ -n "$prev" ]; then
              git log "$prev..HEAD" --pretty=format:"* %s (%h)" --no-merges | grep -v 'chore: release' || true
            else
              git log -n 30 --pretty=format:"* %s (%h)" --no-merges
            fi
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          # (the tag is created on the commit that triggered this run)
          target_commitish: ${{ github.sha }}
          name: dango v${{ env.VERSION }}
          body_path: notes.md
          files: dist/*
          make_latest: true
